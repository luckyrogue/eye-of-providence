[package]
name = "eop-agent"
version = "0.0.1"
description = "Eye of Providence — desktop agent"
edition = "2021"

[lib]
name = "eop_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
dotenvy = "0.15"
thiserror = "2"
keyring = "3"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# Local SQLite encryption: AES-256-GCM AEAD на каждую запись `event_buffer.payload`.
# Ключ генерим один раз и храним в Keychain/Credential Manager через `keyring`.
# Формат записи: [12-byte nonce | ciphertext+16-byte auth tag].
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = "1"
# clipboard digest — sha256 over content (для AI-attribution: совпадение хеша
# между clipboard и paste-событием = "вставлено", без раскрытия содержимого).
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSData", "NSArray"] }
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    # GetTickCount для idle-detection (см. platform/windows/mod.rs).
    # Feature был выпущен — собирался только локально на macOS, где
    # cfg(target_os = "windows") блок исключён.
    "Win32_System_SystemInformation",
] }
