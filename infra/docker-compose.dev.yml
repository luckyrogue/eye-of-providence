services:
  postgres:
    image: postgres:16.6-alpine
    container_name: eop-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eop_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eop}
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-eop} -d ${POSTGRES_DB:-eop}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.10.4-alpine
    container_name: eop-dev-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-eop}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-eop}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-eop_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${DEV_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${DEV_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_dev_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: eop-dev-redis
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: eop-dev-api
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${DEV_API_PORT:-8080}:8080"
    environment:
      EOP_ENV: development
      EOP_HTTP_ADDR: ":8080"
      EOP_POSTGRES_DSN: postgres://${POSTGRES_USER:-eop}:${POSTGRES_PASSWORD:-eop_dev}@postgres:5432/${POSTGRES_DB:-eop}?sslmode=disable
      EOP_CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-eop}:${CLICKHOUSE_PASSWORD:-eop_dev}@clickhouse:9000/${CLICKHOUSE_DB:-eop}
      EOP_REDIS_ADDR: redis:6379
      EOP_JWT_SECRET: ${EOP_JWT_SECRET:-dev-secret-not-for-prod}
      EOP_ALLOWED_ORIGINS: ${EOP_DEV_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      EOP_REPORTS_CRON_SEC: ${EOP_REPORTS_CRON_SEC:-0}
      EOP_GEMINI_API_KEY: ${EOP_GEMINI_API_KEY:-}
      EOP_GITHUB_CLIENT_ID: ${EOP_GITHUB_CLIENT_ID:-}
      EOP_GITHUB_CLIENT_SECRET: ${EOP_GITHUB_CLIENT_SECRET:-}
    volumes:
      - ../backend:/app
      - go_cache:/root/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile.dev
    container_name: eop-dev-dashboard
    depends_on:
      - api
    ports:
      - "${DEV_DASHBOARD_PORT:-5173}:5173"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
    volumes:
      - ../dashboard:/repo/dashboard
      - ../ui:/repo/ui
      - ../i18n:/repo/i18n

volumes:
  postgres_dev_data:
  clickhouse_dev_data:
  redis_dev_data:
  go_cache:
  go_build_cache:
