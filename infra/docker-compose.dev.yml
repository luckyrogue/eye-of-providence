# Локальный dev-стек: Postgres + ClickHouse + Redis + API (hot-reload) + Dashboard (Vite dev).
# Запуск:
#   docker compose -f infra/docker-compose.dev.yml up
#   (или: make dev)
#
# Что внутри:
# - postgres:5432 — миграции применит API через golang-migrate (EOP_AUTO_MIGRATE=true в dev по дефолту)
# - clickhouse:9000 / 8123 — то же самое
# - redis:6379
# - api:8080 — backend, hot-reload через air при изменении .go файлов
# - dashboard:5173 — Vite dev server
#
# CORS уже настроен на http://localhost:5173.

services:
  postgres:
    image: postgres:16-alpine
    container_name: eop-dev-postgres
    environment:
      POSTGRES_USER: eop
      POSTGRES_PASSWORD: eop_dev
      POSTGRES_DB: eop
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eop -d eop"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    container_name: eop-dev-clickhouse
    environment:
      CLICKHOUSE_DB: eop
      CLICKHOUSE_USER: eop
      CLICKHOUSE_PASSWORD: eop_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_dev_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eop-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: eop-dev-api
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      EOP_ENV: development
      EOP_HTTP_ADDR: ":8080"
      EOP_POSTGRES_DSN: "postgres://eop:eop_dev@postgres:5432/eop?sslmode=disable"
      EOP_CLICKHOUSE_DSN: "clickhouse://eop:eop_dev@clickhouse:9000/eop"
      EOP_REDIS_ADDR: "redis:6379"
      EOP_JWT_SECRET: "dev-secret-not-for-prod"
      EOP_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174"
      EOP_REPORTS_CRON_SEC: "0"
      # Опционально:
      EOP_GEMINI_API_KEY: "${EOP_GEMINI_API_KEY:-}"
      EOP_GITHUB_CLIENT_ID: "${EOP_GITHUB_CLIENT_ID:-}"
      EOP_GITHUB_CLIENT_SECRET: "${EOP_GITHUB_CLIENT_SECRET:-}"
    volumes:
      # Bind-mount всего backend для hot-reload через air
      - ../backend:/app
      - go_cache:/root/go/pkg/mod
      - go_build_cache:/root/.cache/go-build

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile.dev
    container_name: eop-dev-dashboard
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: "http://localhost:8080"
    volumes:
      - ../dashboard:/repo/dashboard
      - ../ui:/repo/ui
      - dashboard_node_modules:/repo/node_modules

volumes:
  postgres_dev_data:
  clickhouse_dev_data:
  redis_dev_data:
  go_cache:
  go_build_cache:
  dashboard_node_modules:
