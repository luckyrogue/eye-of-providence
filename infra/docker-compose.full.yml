# Полный self-host стек: api + dashboard + postgres + clickhouse + redis.
# Использовать: docker compose -f infra/docker-compose.full.yml up -d
#
# Миграции применяются автоматически при старте API (EOP_AUTO_MIGRATE=true).
# Если хочешь отключить — выставь EOP_AUTO_MIGRATE=false и применяй вручную
# (см. docs/self-hosting.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: eop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eop"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: eop
      CLICKHOUSE_USER: eop
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: api.Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      EOP_ENV: production
      EOP_HTTP_ADDR: ":8080"
      EOP_POSTGRES_DSN: "postgres://eop:${POSTGRES_PASSWORD}@postgres:5432/eop?sslmode=disable"
      EOP_CLICKHOUSE_DSN: "clickhouse://eop:${CLICKHOUSE_PASSWORD}@clickhouse:9000/eop"
      EOP_REDIS_ADDR: "redis:6379"
      EOP_JWT_SECRET: ${EOP_JWT_SECRET:?EOP_JWT_SECRET is required (≥32 chars)}
      EOP_ALLOWED_ORIGINS: ${EOP_ALLOWED_ORIGINS:-http://localhost:8081}
      EOP_GEMINI_API_KEY: ${EOP_GEMINI_API_KEY:-}
      EOP_GITHUB_CLIENT_ID: ${EOP_GITHUB_CLIENT_ID:-}
      EOP_GITHUB_CLIENT_SECRET: ${EOP_GITHUB_CLIENT_SECRET:-}
      EOP_GITHUB_CALLBACK_URL: ${EOP_GITHUB_CALLBACK_URL:-}
      EOP_REPORTS_CRON_SEC: ${EOP_REPORTS_CRON_SEC:-21600}
      EOP_AUTO_MIGRATE: ${EOP_AUTO_MIGRATE:-true}
      EOP_INVITE_ONLY: ${EOP_INVITE_ONLY:-true}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: dashboard.Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
        CSP_CONNECT_SRC: ${VITE_BACKEND_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8081}:8080"
    depends_on:
      - api

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
