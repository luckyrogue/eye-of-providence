# ClickHouse как отдельный Fly app. Backend подключается через .internal DNS.
# Volume обязательно: без него данные потеряются при reboot machine.

app = "eop-clickhouse"
primary_region = "ams"

[build]
  image = "clickhouse/clickhouse-server:24.10-alpine"

[env]
  CLICKHOUSE_DB = "eop"
  CLICKHOUSE_USER = "eop"
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT = "1"

# CLICKHOUSE_PASSWORD задаётся через secrets:
#   fly -a eop-clickhouse secrets set CLICKHOUSE_PASSWORD=...

[[mounts]]
  source = "clickhouse_data"
  destination = "/var/lib/clickhouse"

# Internal-only сервис: external никому не нужен.
[[services]]
  protocol = "tcp"
  internal_port = 9000

  [[services.ports]]
    port = 9000

[[services]]
  protocol = "tcp"
  internal_port = 8123

  [[services.ports]]
    port = 8123

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
