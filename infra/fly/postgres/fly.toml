# Single-node Postgres как обычный Fly app + volume.
# Дешевле чем `fly postgres create` (managed) — ~$2/мес vs $5+ за HA.
# Без replication, backups через fly volumes snapshots.

app = "eop-postgres"
primary_region = "ams"

[build]
  image = "postgres:16-alpine"

[env]
  POSTGRES_USER = "eop"
  POSTGRES_DB = "eop"
  PGDATA = "/var/lib/postgresql/data/pgdata"

# POSTGRES_PASSWORD задаётся через secrets:
#   fly -a eop-postgres secrets set POSTGRES_PASSWORD=...

[[mounts]]
  source = "postgres_data"
  destination = "/var/lib/postgresql/data"

# Internal-only: external никому не нужен.
[[services]]
  protocol = "tcp"
  internal_port = 5432

  [[services.ports]]
    port = 5432

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
