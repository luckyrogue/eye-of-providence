# DEV ONLY. Не использовать в production.
# Все пароли — публичный default `eop_dev`. Все порты биндятся ТОЛЬКО на
# localhost (127.0.0.1) чтобы случайно поднятый compose не открыл БД в
# интернет. Для prod — managed services (ClickHouse Cloud) или отдельная
# infra с secrets через Dokploy/CI vars.

services:
  postgres:
    image: postgres:16-alpine
    container_name: eop-postgres
    environment:
      POSTGRES_USER: eop
      POSTGRES_PASSWORD: eop_dev
      POSTGRES_DB: eop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eop"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    container_name: eop-clickhouse
    environment:
      CLICKHOUSE_DB: eop
      CLICKHOUSE_USER: eop
      CLICKHOUSE_PASSWORD: eop_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"  # HTTP
      - "127.0.0.1:9000:9000"  # native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7-alpine
    container_name: eop-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
