# Render Blueprint — eop-api на Render free web service.
# Деплой: https://render.com/deploy → подключить github repo → Blueprint apply.
#
# Free tier ограничения:
#   - 750 часов в месяц (один сервис может работать постоянно).
#   - Засыпает после 15 минут без трафика, cold start ~30-60с.
#   - 512MB RAM, shared CPU.
#   - HTTPS включён бесплатно.
#
# Postgres — отдельно через Neon (см. docs/deploy-free.md).
# ClickHouse не подключается — backend использует in-memory fallback.

services:
  - type: web
    name: eop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: EOP_ENV
        value: production
      - key: EOP_HTTP_ADDR
        value: ":10000"  # Render требует PORT через 10000
      - key: EOP_REPORTS_CRON_SEC
        value: "21600"
      - key: EOP_POSTGRES_DSN
        sync: false   # вручную после создания Neon DB
      - key: EOP_JWT_SECRET
        generateValue: true
      - key: EOP_GEMINI_API_KEY
        sync: false
      - key: EOP_GITHUB_CLIENT_ID
        sync: false
      - key: EOP_GITHUB_CLIENT_SECRET
        sync: false
      # EOP_CLICKHOUSE_DSN не задан → in-memory fallback
