<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Sync preboot script — выставляет <html lang> + data-theme="eop" до
         first paint (закрывает FOUC + screenreader lang flicker). Вынесен
         в /preboot.js, чтобы CSP script-src оставался 'self' без
         'unsafe-inline' (XSS hardening). CSP сам задаётся в Caddyfile,
         см. Dockerfile. Здесь мета-тега нет специально — две CSP политики
         (header + meta) применяются конъюнкцией, любое нарушение блокирует. -->
    <script src="/preboot.js"></script>
    <meta
      name="description"
      content="Eye of Providence — сколько ты пишешь сам, а сколько с AI. Privacy-by-design."
    />
    <meta name="robots" content="noindex" />

    <!-- PWA manifest + icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- iOS PWA: standalone display + status-bar style. iOS не использует
         manifest для всех опций — нужны эти meta. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EoP" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Eye of Providence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
