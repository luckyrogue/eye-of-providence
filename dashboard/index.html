<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Sync <html lang> до first paint — иначе скринридеры и spell-check
      // увидят "ru" пока не загрузится i18next. Ключ должен совпадать с
      // LOCALE_STORAGE_KEY (@eop/i18n constants).
      (function () {
        try {
          var supported = ["ru", "en", "kk", "es"];
          var raw = localStorage.getItem("eop_locale");
          var lng = raw && supported.indexOf(raw) !== -1 ? raw : null;
          if (!lng && navigator.language) {
            var base = navigator.language.split("-")[0];
            if (supported.indexOf(base) !== -1) lng = base;
          }
          document.documentElement.lang = lng || "ru";
        } catch (_) {}
      })();
    </script>
    <!-- CSP — closed beta hardening. Описание:
         default-src 'self' блокирует загрузку scripts/styles с других origin'ов.
         font-src/style-src 'unsafe-inline' нужны для Google Fonts + Tailwind
         динамических классов через <style>. img-src 'self' data: blob: —
         генерация heatmap/canvas в blob URLs.
         connect-src включает прод API + любые https-хосты (для self-hosted
         beta), плюс ws: для Vite HMR в dev (игнорируется в prod build).
         Если CSP сломает что-то в проде — закомментируйте эту строку,
         не строгий блокер. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta
      name="description"
      content="Eye of Providence — сколько ты пишешь сам, а сколько с AI. Privacy-by-design."
    />
    <meta name="robots" content="noindex" />

    <!-- PWA manifest + icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- iOS PWA: standalone display + status-bar style. iOS не использует
         manifest для всех опций — нужны эти meta. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EoP" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Eye of Providence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
