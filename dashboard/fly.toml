app = "eop-dashboard"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  # Контекст должен быть корнем монорепо, чтобы Dockerfile видел ui/ и dashboard/
  # Запускать: fly deploy -c dashboard/fly.toml -a eop-dashboard --build-arg VITE_BACKEND_URL=https://eop-api.fly.dev .

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
