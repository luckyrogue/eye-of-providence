root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  full_bin = "./tmp/api"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "gen", "migrations"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = false

[color]
  main = "magenta"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
