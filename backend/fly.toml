# Fly.io config для eop-api.
# Деплой: fly deploy (после fly launch и настройки secrets).
# Подробности: docs/deploy-fly.md.

app = "eop-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  EOP_ENV = "production"
  EOP_HTTP_ADDR = ":8080"
  # DSN'ы переопределяются secrets, пустые в env чтобы их можно было удалить
  EOP_REPORTS_CRON_SEC = "21600"  # 6h

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[metrics]
  port = 8080
  path = "/metrics"
