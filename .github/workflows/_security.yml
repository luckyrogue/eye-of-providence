# Reusable: security checks.
#   - CodeQL          — SAST для Go + JS/TS (semantic-search)
#   - gitleaks        — secret detection в diff'е
#   - trivy-fs        — source-level CVE-scan (npm/go.sum lockfiles)
#   - osv-scanner     — Google OSV для всех manifest'ов (pnpm/go/cargo)
#   - dependency-rev  — PR-only, блокирует вулнерабельные deps на ввозе
#
# Все SARIF загружаются в Code Scanning → Security tab.
name: _security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read # для osv-scanner reusable workflow (см. ниже)

jobs:
  codeql:
    name: security / codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - if: matrix.language == 'go'
        run: cd backend && go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: security / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks нужна история для diff-mode
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # для org-аккаунтов

  trivy-fs:
    name: security / trivy-fs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Trivy fs scan (SARIF, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # OSV-Scanner — Google's free vuln DB сканер по всем lockfiles
  # (pnpm-lock.yaml, go.sum, Cargo.lock, etc.). Дополняет Trivy: OSV
  # покрывает экосистемы лучше, Trivy — OS-пакеты.
  #
  # Используем reusable workflow от Google — он сам собирает SARIF и грузит
  # в Code Scanning. Continue-on-error для Phase 1 (baseline'имся 2 недели,
  # после ratchet'нём вручную через `if-no-files-found: error`).
  osv-scanner:
    name: security / osv-scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.2
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      scan-args: |-
        -r
        --skip-git
        ./

  # Dependency Review — PR-only. Блокирует merge если PR ввозит deps
  # с известными уязвимостями high severity или GPL-incompatible лицензиями.
  # На push в main не запускаем — там уже поздно (deps уже в коде).
  dependency-review:
    name: security / dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Лицензии — блокируем только viral copyleft (GPL/AGPL — несовместимо
          # с проприетарным backend). LGPL/MPL — ok через dynamic linking.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
          comment-summary-in-pr: on-failure
