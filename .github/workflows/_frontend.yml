# Reusable: frontend matrix per pnpm workspace.
#
# Каждый workspace проверяется параллельно. install — кешируется (pnpm store).
name: _frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: frontend / ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@eop/ui"
            cmd: "lint"
            label: "ui"
          - package: "@eop/dashboard"
            cmd: "build"
            label: "dashboard"
          - package: "@eop/dashboard"
            cmd: "test"
            label: "dashboard-test"
          - package: "@eop/agent"
            cmd: "build"
            label: "agent"
          - package: "@eop/browser-extension"
            cmd: "build"
            label: "browser-extension"
          - package: "eop-vscode"
            cmd: "compile"
            label: "vscode"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.cmd }} for ${{ matrix.package }}
        run: pnpm -F ${{ matrix.package }} ${{ matrix.cmd }}
