# Reusable: end-to-end Playwright tests против реального стека.
#
# Поднимает PG/CH/Redis через docker compose, билдит dashboard со встроенным
# VITE_BACKEND_URL, запускает Go backend, проходит Playwright suite.
#
# Артефакты: playwright-report/ (HTML) + test-results/ (traces+videos) на fail.
name: _e2e

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e / playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      # --- Toolchains ---
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      # --- Install JS deps ---
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # --- Infra ---
      - name: Start PG / CH / Redis
        run: docker compose -f infra/docker-compose.yml up -d postgres clickhouse redis

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec eop-postgres pg_isready -U eop &>/dev/null; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres not ready"; exit 1

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8123/ping &>/dev/null; then
              echo "clickhouse ready"; exit 0
            fi
            sleep 2
          done
          echo "clickhouse not ready"; exit 1

      # --- Build dashboard с правильным backend URL ---
      - name: Build dashboard
        env:
          VITE_BACKEND_URL: http://localhost:8080
        run: pnpm -F @eop/dashboard build

      # --- Start backend в background ---
      - name: Start backend
        env:
          EOP_HTTP_ADDR: ":8080"
          EOP_ENV: development
          EOP_INVITE_ONLY: "false"
          EOP_ENABLE_DEV_TOKEN: "true"
          EOP_ALLOWED_ORIGINS: "http://localhost:4173"
          EOP_AUTO_MIGRATE: "true"
          EOP_JWT_SECRET: e2e_test_secret_at_least_32_chars_xx
          EOP_POSTGRES_DSN: postgres://eop:eop_dev@localhost:5432/eop?sslmode=disable
          EOP_CLICKHOUSE_DSN: clickhouse://eop:eop_dev@localhost:9000/eop
          EOP_REDIS_ADDR: localhost:6379
          EOP_REPORTS_CRON_SEC: "0"
          # 0 = без лимита; default 3 ломает teams.spec где создаём >3 команд
          EOP_BETA_TEAM_LIMIT: "0"
        working-directory: backend
        run: |
          go run ./cmd/api > ../e2e-backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for backend /healthz
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz &>/dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 2
          done
          echo "backend not ready"
          echo "--- backend log tail ---"
          tail -100 e2e-backend.log
          exit 1

      # --- Playwright ---
      - name: Install Playwright browsers
        run: pnpm -F @eop/e2e exec playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: "1"
        run: pnpm -F @eop/e2e test

      # --- Artifacts on failure ---
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results (traces + videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: e2e-backend.log
          retention-days: 7

      - name: Stop backend
        if: always()
        run: |
          if [ -n "${BACKEND_PID:-}" ]; then
            kill "$BACKEND_PID" 2>/dev/null || true
          fi
