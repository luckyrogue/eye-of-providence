# Continuous build — каждый push в main собирает desktop installers и
# заливает в "rolling" prerelease `continuous-main`. Alpha-юзеры всегда
# скачивают latest с https://github.com/<owner>/<repo>/releases/tag/continuous-main.
#
# Зачем отдельно от release.yml:
#   - release.yml завязан на semver-tag (v0.x.y) — это финальные релизы
#   - continuous-build бежит на каждый main commit → быстрая обратная связь
#     для alpha-тестеров, не нужно делать tag каждый раз
#   - unsigned binaries (на macOS — right-click → Open; Windows — SmartScreen)
#     для closed alpha ок; для public нужно настроить APPLE_*/WINDOWS_*
#     secrets (см. release.yml для полного списка)
#
# Path filter:
#   workflow триггерится только если меняется код агента/extension/UI
#   (а не doc-typos в README). Экономит CI-минуты + cache.
#
# Concurrency:
#   group="continuous-build" + cancel-in-progress=true — если пушнули 3
#   коммита подряд, бежит только последний. Старые отменяются.
#
# Rolling tag:
#   `continuous-main` — fixed tag, который мы перемещаем на текущий SHA
#   перед публикацией релиза. softprops/action-gh-release@v3 при наличии
#   tag_name делает update existing release (overwrite assets).
name: Continuous Build

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "browser-extension/**"
      - "ide-vscode/**"
      - "ui/**"
      - "i18n/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/continuous-build.yml"
  workflow_dispatch:

permissions:
  contents: write # для создания/обновления Release + перемещения tag

concurrency:
  group: continuous-build
  cancel-in-progress: true

env:
  ROLLING_TAG: continuous-main

jobs:
  # --- Tauri agent: matrix per OS ---
  tauri:
    name: tauri / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/src-tauri

      # Linux — Tauri зависит от webkit2gtk + libsoup3
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      # Unsigned build — secrets для signing намеренно НЕ пробрасываются.
      # Если в будущем настроим Apple Developer + Windows EV cert, можно
      # будет включить через `if: secrets.APPLE_CERTIFICATE != ''` (но GitHub
      # context syntax не поддерживает это напрямую — придётся обернуть в job
      # outputs). Пока — closed alpha = unsigned.
      # НЕ передаём tagName/releaseName — без них tauri-action только
      # собирает бинари и НЕ создаёт GH Release сам. Single rolling release
      # делает publish-job ниже после успешного матрикса.
      - name: Build Tauri (unsigned)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: agent
          args: ${{ matrix.args }}

      # Собираем артефакты в плоский каталог для upload в release.
      # tauri-action кладёт их в target/<triple>/release/bundle/<format>/
      - name: Stage artifacts (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          shopt -s globstar nullglob
          for f in agent/src-tauri/target/**/release/bundle/**/*.{dmg,AppImage,deb}; do
            cp "$f" artifacts/
          done
          ls -la artifacts/
        shell: bash

      - name: Stage artifacts (windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Get-ChildItem -Path agent/src-tauri/target -Recurse -Include *.msi,*.exe |
            Where-Object { $_.FullName -match 'release\\bundle' } |
            ForEach-Object { Copy-Item $_.FullName -Destination artifacts/ }
          Get-ChildItem artifacts/
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # --- VS Code .vsix ---
  vscode:
    name: vscode / vsix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F eop-vscode compile
      - name: Package .vsix
        working-directory: ide-vscode
        run: |
          npm i -g @vscode/vsce
          vsce package --no-dependencies --skip-license -o eop-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: ide-vscode/eop-vscode.vsix
          if-no-files-found: error
          retention-days: 7

  # --- Browser extension .zip ---
  browser-ext:
    name: browser-ext / zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @eop/browser-extension build
      - name: Package zip
        working-directory: browser-extension
        run: |
          cd dist && zip -r ../eop-browser-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: browser-extension/eop-browser-extension.zip
          if-no-files-found: error
          retention-days: 7

  # --- Aggregate: move rolling tag + upsert prerelease с собранными артефактами ---
  publish:
    name: publish / rolling prerelease
    needs: [tauri, vscode, browser-ext]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts/

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find dist-artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.vsix' -o \
            -name '*.zip' \
          \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      # Delete-then-create вместо update: gh release upload по умолчанию
      # *добавляет* файлы, не заменяет — без cleanup рискуем накопить дубли
      # с разных run'ов. `--cleanup-tag` атомарно сносит release+tag.
      - name: Delete prior rolling release (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$ROLLING_TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Create rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$ROLLING_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Continuous build (main)" \
            --prerelease \
            --notes "Rolling prerelease, обновляется каждым push в \`main\`.

          **Не для production — unsigned binaries.**

          - macOS: после распаковки \`.dmg\` — right-click → Open для обхода Gatekeeper.
          - Windows: SmartScreen warning → More info → Run anyway.
          - Linux: \`chmod +x *.AppImage && ./Eye-of-Providence_*.AppImage\`.

          Commit: $GITHUB_SHA
          Built: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
