name: CI

on:
  push:
    branches: [main]
  pull_request:

# Один последний run на ветку — старые отменяются. На main не отменяем,
# чтобы не сломать deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12
          working-directory: backend
          args: --timeout=5m

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: eop
          POSTGRES_PASSWORD: eop_dev
          POSTGRES_DB: eop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      EOP_TEST_PG_DSN: postgres://eop:eop_dev@localhost:5432/eop_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Integration tests (Postgres)
        run: go test -race -count=1 -tags=integration ./internal/teams/...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @eop/ui lint
      - name: Type-check + build dashboard
        run: pnpm -F @eop/dashboard build
      - run: pnpm -F @eop/agent build
      - name: Build browser-extension
        run: pnpm -F @eop/browser-extension build
      - name: Compile vscode extension
        run: pnpm -F eop-vscode compile

  agent-rust:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/src-tauri
      - run: cargo check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, backend-lint, frontend]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image base (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eop" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (& push on main) combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || '/api' }}
            CSP_CONNECT_SRC=${{ vars.CSP_CONNECT_SRC || '''self''' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy webhook
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_WEBHOOK secret is not set"
            exit 1
          fi
          curl -fsSL -X POST "$WEBHOOK"
