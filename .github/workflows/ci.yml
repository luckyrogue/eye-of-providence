# Main CI orchestrator.
#
# Архитектура:
#   1. detect-changes — paths-filter определяет какие зоны затронуты.
#   2. _security.yml — всегда (codeql + gitleaks + trivy fs).
#   3. _backend / _frontend / _agent-rust — только если соответствующие
#      пути изменились или ветка main (полный прогон).
#   4. _docker — после успеха backend + frontend + security.
#   5. _deploy — только push на main, после docker.
#
# permissions: минимум `contents: read` на верхнем уровне; reusable
# workflow'ы запрашивают доп. права (packages: write для GHCR,
# security-events: write для SARIF) — но только в своих джобах.
#
# concurrency: PR-runs кенселятся на новых push'ах. На main НЕ кенселим —
# чтобы не сломать deploy в середине.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      agent_rust: ${{ steps.filter.outputs.agent_rust }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'dashboard/**'
              - 'ui/**'
              - 'i18n/**'
              - 'agent/src/**'
              - 'agent/index.html'
              - 'agent/package.json'
              - 'agent/vite.config.ts'
              - 'agent/tsconfig.json'
              - 'agent/tailwind.config.js'
              - 'agent/postcss.config.js'
              - 'browser-extension/**'
              - 'ide-vscode/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - '.prettierrc.json'
              - '.prettierignore'
            agent_rust:
              - 'agent/src-tauri/**'
            docker:
              - 'Dockerfile'
              - 'backend/**'
              - 'dashboard/**'
              - 'ui/**'
              - 'i18n/**'
            ci:
              - '.github/**'

  security:
    name: security
    needs: changes
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  backend:
    name: backend
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_backend.yml

  frontend:
    name: frontend
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_frontend.yml

  agent-rust:
    name: agent-rust
    needs: changes
    if: |
      needs.changes.outputs.agent_rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_agent-rust.yml

  # E2E: запускаем когда backend ИЛИ frontend ИЛИ CI меняются. На main —
  # всегда (post-merge insurance). Параллельно с docker (независимые).
  e2e:
    name: e2e
    needs: [changes, backend, frontend]
    if: |
      always() && !cancelled() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.ci == 'true' ||
       github.ref == 'refs/heads/main')
    uses: ./.github/workflows/_e2e.yml

  # Docker: на PR — build-only (load), на main — push в GHCR.
  # Запускаем только если backend+frontend+security прошли (или skipped).
  docker:
    name: docker
    needs: [changes, backend, frontend, security]
    if: |
      always() && !cancelled() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      needs.security.result == 'success' &&
      (needs.changes.outputs.docker == 'true' ||
       needs.changes.outputs.ci == 'true' ||
       github.ref == 'refs/heads/main')
    uses: ./.github/workflows/_docker.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # cosign keyless OIDC
      attestations: write # actions/attest-* (SLSA provenance + SBOM)

  deploy:
    name: deploy
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    secrets:
      DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
