name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -F @eop/ui lint
      - name: Type-check + build dashboard
        run: pnpm -F @eop/dashboard build
      - run: pnpm -F @eop/agent build

  agent-rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/src-tauri
      - run: cargo check

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api.Dockerfile
          push: false
          load: true
          tags: |
            eop-api:${{ github.sha }}
            eop-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard.Dockerfile
          push: false
          load: true
          build-args: |
            VITE_BACKEND_URL=http://localhost:8080
            CSP_CONNECT_SRC=http://localhost:8080
          tags: |
            eop-dashboard:${{ github.sha }}
            eop-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (api)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eop-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0" # warning, not blocking — поднимем до 1 после первого clean run
      - name: Trivy scan (dashboard)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eop-dashboard:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
