name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -F @eop/ui lint
      - name: Type-check + build dashboard
        run: pnpm -F @eop/dashboard build
      - run: pnpm -F @eop/agent build
      - name: Build browser-extension
        run: pnpm -F @eop/browser-extension build
      - name: Compile vscode extension
        run: pnpm -F eop-vscode compile

  agent-rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/src-tauri
      - run: cargo check

  docker-api:
    runs-on: ubuntu-latest
    needs: [backend]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image base (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eop-api" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (& push on main) api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Trivy scan (api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0" # warning, not blocking — поднимем до 1 после первого clean run

  docker-dashboard:
    runs-on: ubuntu-latest
    needs: [frontend]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image base (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eop-dashboard" >> "$GITHUB_ENV"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (& push on main) dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || 'http://localhost:8080' }}
            CSP_CONNECT_SRC=${{ vars.CSP_CONNECT_SRC || 'http://localhost:8080' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Trivy scan (dashboard)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  deploy-api:
    runs-on: ubuntu-latest
    needs: [docker-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy webhook (api)
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_API_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_API_WEBHOOK secret is not set"
            exit 1
          fi
          curl -fsSL -X POST "$WEBHOOK"

  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: [docker-dashboard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy webhook (dashboard)
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DASHBOARD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_DASHBOARD_WEBHOOK secret is not set"
            exit 1
          fi
          curl -fsSL -X POST "$WEBHOOK"
