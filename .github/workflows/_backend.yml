# Reusable: backend lint + unit + integration + build + coverage gate.
#
# Вызывается из ci.yml. permissions наследуются от caller'а (минимум — read).
# Postgres-services поднимаются только для integration-job, чтобы lint/unit
# не ждали PG ready.
#
# Coverage gate: total < threshold → fail. Текущий baseline ~15%, floor=12%
# (ratchet -2pp). Поднимаем threshold раз в спринт после крупных test-ассеров.
# Цель — 80% к v1.0 (особенно на auth/billing/ingest/migrate — payment-critical).
name: _backend

on:
  workflow_call:
    inputs:
      run-integration:
        type: boolean
        default: true
        description: "Запускать integration-тесты (требуют PG)"
      coverage-threshold:
        type: number
        default: 12
        description: "Минимальный % покрытия (fail если ниже)"

permissions:
  contents: read

jobs:
  lint:
    name: backend / lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: backend
          args: --timeout=5m

  unit:
    name: backend / unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: backend }
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: go vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...

      # Coverage gate — payment-grade требование. Парсим total%, сравниваем
      # с threshold, печатаем annotation если ниже. Не использует toolchain —
      # чисто go cover + awk, переносимо.
      - name: Coverage gate
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Coverage: ${TOTAL}% (threshold: ${THRESHOLD}%)"
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "**${TOTAL}%** (gate: ${THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk "BEGIN{exit !(${TOTAL} < ${THRESHOLD})}"; then
            echo "::error::backend coverage ${TOTAL}% < ${THRESHOLD}% (gate fail)"
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  integration:
    name: backend / integration
    if: ${{ inputs.run-integration }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: eop
          POSTGRES_PASSWORD: eop_dev
          POSTGRES_DB: eop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run: { working-directory: backend }
    env:
      EOP_TEST_PG_DSN: postgres://eop:eop_dev@localhost:5432/eop_test?sslmode=disable
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Integration tests (Postgres)
        # -p 1: integration пакеты (teams + auth) разделяют одну тестовую БД,
        # параллельный запуск даёт race на TRUNCATE / FK CASCADE.
        run: go test -race -count=1 -p 1 -tags=integration ./internal/teams/... ./internal/auth/...
